name: LaNonApp pre-alpha verifiable builds
on:
  push:
    branches: ["lanonapp-preview-v09-2026-11-03"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript domain
        run: node --test tests/core.test.js
        working-directory: lanonapp
      - name: Python SPSE
        run: python -m unittest discover -s tests -p test_engine.py
        working-directory: lanonapp
  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Copy web assets
        run: mkdir -p lanonapp/android/app/src/main/assets/web && cp -r lanonapp/app/. lanonapp/android/app/src/main/assets/web/
      - name: Assemble debug APK
        working-directory: lanonapp/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LaNonApp-v09-debug-APK
          path: lanonapp/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --name LaNonApp-v09 --add-data "app;app" desktop/lanonapp_desktop.py
        working-directory: lanonapp
      - uses: actions/upload-artifact@v4
        with:
          name: LaNonApp-Windows-EXE
          path: lanonapp/dist/LaNonApp-v09.exe
          if-no-files-found: error
